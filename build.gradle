plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'me.xpyex.software'
version = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'

    // Selenium 浏览器自动化（4.x 要求 Java 11+，4.35+ 建议 Java 17+）
    // 只保留 Edge：排除其它浏览器 driver，以及 Selenium Manager。
    // 代码总是自行设置 webdriver.edge.driver（本地 driver/msedgedriver.exe 或 WebDriverManager 下载后设置），
    // 因此 Selenium Manager 的自动下载功能不会被触发；若以后某处不设路径再把它加回来。
    implementation('org.seleniumhq.selenium:selenium-java:4.46.0') {
        //exclude group: 'org.seleniumhq.selenium', module: 'selenium-manager'
        exclude group: 'org.seleniumhq.selenium', module: 'selenium-chrome-driver'
        exclude group: 'org.seleniumhq.selenium', module: 'selenium-firefox-driver'
        exclude group: 'org.seleniumhq.selenium', module: 'selenium-ie-driver'
        exclude group: 'org.seleniumhq.selenium', module: 'selenium-safari-driver'
    }
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.3'

    // 日志依赖
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'me.xpyex.software.feedback.Main'
}